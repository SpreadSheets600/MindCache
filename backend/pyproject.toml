[project]
name = "backend"
version = "0.1.0"
description = "AI-powered Personal Browser Memory System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "trafilatura>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=0.6.2",
    "rank-bm25>=0.2.2",
    "googlesearch-python>=1.3.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
    "pypdf>=6.12.2",
    "sentence-transformers>=6.3.0",
    "transformers>=5.24.0",
    "pillow>=13.0.0",
    "torchvision>=0.29.2",
    "watchdog>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["I", "E", "B008", "UP037", "UP045"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["F401"]
"tests/*" = ["F401"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
