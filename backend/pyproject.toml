[project]
name = "backend"
version = "0.1.0"
description = "AI-powered Personal Browser Memory System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "trafilatura>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=2.5.0",
    "keybert>=0.8.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=0.6.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "keybert.*",
    "faiss.*",
    "sentence_transformers.*",
    "bs4.*",
]
ignore_missing_imports = true
